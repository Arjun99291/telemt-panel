<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTProto Proxy Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-page" class="page">
    <div class="login-card">
      <h1>MTProto Panel</h1>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Username" value="admin" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit">Login</button>
        <div id="login-error" class="error"></div>
      </form>
    </div>
  </div>

  <div id="dashboard-page" class="page hidden">
    <header>
      <h1>MTProto Proxy Panel</h1>
      <div class="header-actions">
        <span id="user-info"></span>
        <button id="logout-btn" class="btn-secondary">Logout</button>
      </div>
    </header>

    <main>
      <div class="controls">
        <div class="create-form">
          <input type="text" id="proxy-name" placeholder="Proxy name">
          <button id="create-btn" class="btn-primary">+ Create Proxy</button>
        </div>
        <button id="refresh-btn" class="btn-secondary">Refresh</button>
      </div>

      <div id="proxy-list" class="proxy-grid"></div>
      <div id="no-proxies" class="empty-state hidden">
        <p>No proxies yet. Create one to get started.</p>
      </div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
